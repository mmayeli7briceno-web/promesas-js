<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buscador de Los Simpson</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      padding: 40px;
    }
    form {
      background: white;
      padding: 20px;
      border-radius: 8px;
      width: 300px;
    }
    div { margin-bottom: 10px; }
    label { display: block; margin-bottom: 3px; }
    input { width: 100%; padding: 6px; box-sizing: border-box; }
    button { padding: 6px 12px; }
    img { max-width: 100%; max-height: 300px; display: block; margin: 0 auto; }
  </style>
</head>
<body>

  <form action="" id="formBuscador">
    <div>
      <input type="text" id="idpersonaje" placeholder="Ejem. 1">
      <button type="submit">Buscar</button>
    </div>

    <div>
      <label for="nombre">Nombre:</label>
      <input type="text" id="nombre">
    </div>

    <div>
      <label for="ocupacion">Ocupación:</label>
      <input type="text" id="ocupacion">
    </div>

    <div>
      <label for="edad">Edad:</label>
      <input type="text" id="edad">
    </div>

    <div>
      <label>Imagen:</label>
      <img id="imagen" src="" alt="">
    </div>
  </form>

  <script>

    const formulario = document.getElementById('formBuscador')
    const id = document.getElementById('idpersonaje')
    const nombre = document.getElementById('nombre')
    const ocupacion = document.getElementById('ocupacion')
    const edad = document.getElementById('edad')
    const imagen = document.getElementById('imagen')

    formulario.addEventListener("submit", (event) => {
      event.preventDefault()  //Detener el envio

      obtenerPersonaje(id.value.trim())
    })

    function limpiar() {
      nombre.value = ''
      ocupacion.value = ''
      edad.value = ''
      imagen.removeAttribute('src')
    }

    async function obtenerPersonaje(id) {
      const API_URL = `https://thesimpsonsapi.com/api/characters/${id}`

      try {
        const respuesta = await fetch(API_URL)

        if (!respuesta.ok) {
          limpiar()
          alert('No existe este personaje')
          throw new Error(`Error de comunicación: ${respuesta.status}`)
        }

        const datos = await respuesta.json()

        //En caso el personaje no tenga datos
        if (!datos.name) {
          limpiar()
          alert('No existe este personaje')
          return
        }

        //Enviando resultados al formulario
        nombre.value = datos.name
        ocupacion.value = datos.occupation || 'No disponible'
        edad.value = datos.age || 'No disponible'
        imagen.src = `https://cdn.thesimpsonsapi.com/500${datos.portrait_path}`
        imagen.alt = datos.name

      } catch (e) {
        console.error(e)
      }
    }
  </script>
</body>
</html>
